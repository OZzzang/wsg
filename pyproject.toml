[project]
name = "wsg"
version = "0.1.0"
description = "API load testing tool that produces latency/throughput graphs"
readme = "README.md"
authors = [
    { name = "Owen Zeng", email = "owenzeng315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
]

[project.scripts]
wsg = "wsg:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
